<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Agendamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h1>Editar Agendamento</h1>
<p class="subtitulo">{{ agendamento[1] }}</p>

<form action="/atualizar/{{ agendamento[0] }}" method="post">
    <label>Data</label>
    <input type="date" name="data" value="{{ agendamento[2] }}" required>

    <label>Horário</label>
    <input type="time" name="horario" value="{{ agendamento[3] }}" required>

    <button type="submit">Salvar</button>
</form>

<a class="voltar" href="/">← Voltar</a>

</div>

</body>
</html>
